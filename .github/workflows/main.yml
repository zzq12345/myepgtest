name: Sync from Private Repo (epgtest)

on:
  workflow_dispatch:
  schedule:
    - cron: '55 20,4 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository (epg)
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git config core.precomposeunicode true

      # 核心优化：浅克隆 + 跳过 LFS + 去掉 tags
      - name: Clone private repository (epgtest)
        run: |
          git clone -b main \
            --single-branch \
            --depth 1 \
            --no-tags \
            https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/epgtest.git private-repo

      - name: Sync specific files
        id: sync
        run: |
          files=(
            'README.md'
            'swepg.xml'
            'swepg.xml.gz'
            'twepg.xml'
            'twepg.xml.gz'
            'youtubelocal.m3u'
            'youtubeworld.m3u'
            'yu.m3u'
            '简体电视台目录.txt'
            '繁體電視台目錄.txt'
          )

          changed=()
          for file in "${files[@]}"; do
            src="private-repo/$file"
            dst="./$file"
            if [ -f "$src" ]; then
              if ! cmp -s "$src" "$dst" 2>/dev/null; then
                cp "$src" "$dst"
                changed+=("$file")
                echo "✅ Synced: $file"
              else
                echo "ℹ️ No changes: $file"
              fi
            else
              echo "⚠️ File not found in private repo: $file"
            fi
          done

          if [ ${#changed[@]} -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_ENV
            # 保存为逗号分隔字符串（后续用 tr 拆开）
            printf -v joined '%s,' "${changed[@]}"
            echo "changed_files=${joined%,}" >> $GITHUB_ENV
          else
            echo "has_changes=false" >> $GITHUB_ENV
          fi

      - name: Clean up private repo clone
        run: rm -rf private-repo

      - name: Commit and push if changed
        if: env.has_changes == 'true'
        run: |
          export TZ='Asia/Shanghai'
          commit_time=$(date +'%Y-%m-%d %H:%M:%S %Z')

          git pull --rebase --autostash origin main

          # ====== 修复点：将逗号分隔转为空格，让 git add 正确识别多个文件 ======
          files_to_add=$(echo "${{ env.changed_files }}" | tr ',' ' ')
          git add $files_to_add

          git commit -m "chore: sync files from epgtest [北京时间: $commit_time]"

          max_retries=3
          for ((i=1; i<=max_retries; i++)); do
            echo "Push attempt $i/$max_retries"
            if git push origin main; then
              echo "✅ Push succeeded"
              exit 0
            fi
            echo "Push failed, waiting to retry..."
            sleep 3
          done
          echo "❌ Push failed after $max_retries attempts"
          exit 1

      - name: Log result
        run: |
          if [ "${{ env.has_changes }}" = "true" ]; then
            echo "✅ Files synced successfully: ${{ env.changed_files }}"
          else
            echo "ℹ️ All files are already up-to-date"
          fi
