name: Sync from Private Repo (epgtest)

on:
  # 手動觸發（方便測試）
  workflow_dispatch:
  # 定時觸發（每天 3:00 和 15:00，按需修改）
  # schedule:
  #   - cron: '0 3,15 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository (epg)
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false          # 避免中文路徑轉義
          git config core.precomposeunicode true   # 處理 Unicode 檔案名稱

      - name: Clone private repository (epgtest)
        run: |
          git clone -b main --single-branch https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository_owner }}/epgtest.git private-repo

      - name: Sync specific files
        run: |
          # 定義需要同步的檔案列表（注意檔案名稱中的中文和特殊字元）
          files=(
            'README.md'
            'swepg.xml'
            'swepg.xml.gz'
            'twepg.xml'
            'twepg.xml.gz'
            'youtubelocal.m3u'
            'youtubeworld.m3u'
            'yu.m3u'
            '简体电视台目录.txt'
            '繁體電視台目錄.txt'
          )

          changed=()
          for file in "${files[@]}"; do
            if [ -f "private-repo/$file" ]; then
              if ! cmp -s "private-repo/$file" "./$file" 2>/dev/null; then
                cp "private-repo/$file" "./$file"
                changed+=("$file")
                echo "✅ Synced: $file"
              else
                echo "ℹ️ No changes: $file"
              fi
            else
              echo "⚠️ File not found in private repo: $file"
            fi
          done

          # 記錄是否有實際變化
          if [ ${#changed[@]} -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_ENV
            echo "changed_files=${changed[*]}" >> $GITHUB_ENV
          else
            echo "has_changes=false" >> $GITHUB_ENV
          fi

      - name: Clean up private repo clone
        run: rm -rf private-repo

      - name: Commit and push if changed
        if: env.has_changes == 'true'
        run: |
          export TZ='Asia/Shanghai'
          commit_time=$(date +'%Y-%m-%d %H:%M:%S %Z')
          # 先拉取遠端最新變更，自動儲存未提交的改動，避免 rebase 衝突
          git pull --rebase --autostash origin main
          git add .
          git commit -m "chore: sync files from epgtest [北京時間: $commit_time]"
          git push origin main

      - name: Log result
        run: |
          if [ "$has_changes" = "true" ]; then
            echo "✅ Files synced successfully: $changed_files"
          else
            echo "ℹ️ All files are already up-to-date"
          fi            'swepg.xml'
            'swepg.xml.gz'
            'twepg.xml'
            'twepg.xml.gz'
            'youtubelocal.m3u'
            'youtubeworld.m3u'
            'yu.m3u'
            '简体电视台目录.txt'
            '繁體電視台目錄.txt'
          )

          changed=()
          for file in "${files[@]}"; do
            if [ -f "private-repo/$file" ]; then
              if ! cmp -s "private-repo/$file" "./$file" 2>/dev/null; then
                cp "private-repo/$file" "./$file"
                changed+=("$file")
                echo "✅ Synced: $file"
              else
                echo "ℹ️ No changes: $file"
              fi
            else
              echo "⚠️ File not found in private repo: $file"
            fi
          done

          # 记录是否有实际变化
          if [ ${#changed[@]} -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_ENV
            echo "changed_files=${changed[*]}" >> $GITHUB_ENV
          else
            echo "has_changes=false" >> $GITHUB_ENV
          fi

      - name: Clean up private repo clone
        run: rm -rf private-repo

      - name: Commit and push if changed
        if: env.has_changes == 'true'
        run: |
          export TZ='Asia/Shanghai'
          commit_time=$(date +'%Y-%m-%d %H:%M:%S %Z')
          git add .
          git commit -m "chore: sync files from epgtest [北京时间: $commit_time]"
          git push origin main

      - name: Log result
        run: |
          if [ "$has_changes" = "true" ]; then
            echo "✅ Files synced successfully: $changed_files"
          else
            echo "ℹ️ All files are already up-to-date"
          fi
